<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pillar — Take Control of Your Money</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body class="welcome-page">

  <!-- Floating particles bg -->
  <div class="particles" id="particles"></div>

  <nav class="nav-bar animate__animated animate__fadeInDown">
    <div class="logo">Pillar<span class="dot">.</span></div>
    <div class="nav-links">
      <a href="#features">Features</a>
      <a href="#" class="btn-outline-sm">Sign In</a>
    </div>
  </nav>

  <main class="hero">
    <!-- Card stack visual -->
    <div class="card-stack animate__animated animate__fadeInLeft animate__delay-1s">
      <div class="mock-card card-back">
        <span class="card-label">Debit Card</span>
        <span class="card-num">•••• 0958</span>
        <svg class="visa-logo" viewBox="0 0 50 16" fill="none"><text x="0" y="13" font-size="14" fill="white" font-family="serif" font-weight="bold">VISA</text></svg>
      </div>
      <div class="mock-card card-front">
        <div class="card-top-row">
          <span class="card-label">Debit Card</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"><path d="M12 2a7 7 0 1 0 0 14A7 7 0 0 0 12 2z"/><path d="M12 6v6l4 2"/></svg>
        </div>
        <div class="card-chip"></div>
        <span class="card-num">•••• 4568</span>
        <div class="card-bottom-row">
          <span class="card-name">ALEX T.</span>
          <div class="mc-circles">
            <div class="mc-c mc-c1"></div>
            <div class="mc-c mc-c2"></div>
          </div>
        </div>
        <div class="card-nfc">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"><path d="M8 12a4 4 0 0 0 4 4M12 8a4 4 0 0 0 4 4M5 12a7 7 0 0 0 7 7M12 5a7 7 0 0 0 7 7"/></svg>
        </div>
      </div>
    </div>

    <!-- Hero text -->
    <div class="hero-text animate__animated animate__fadeInRight animate__delay-1s">
      <h1>Take Control<br>of Your Money</h1>
      <p>Track spending, plan smarter, and stay one step ahead — every day.</p>
      <a href="/dashboard" class="btn-get-started">
        Get Started
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
  </main>

  <!-- Feature pills -->
  <section class="features animate__animated animate__fadeInUp animate__delay-2s" id="features">
    <div class="feat-pill">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      Multiple cards
    </div>
    <div class="feat-pill">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Instant transfers
    </div>
    <div class="feat-pill">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      Spending insights
    </div>
    <div class="feat-pill">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      Real-time alerts
    </div>
  </section>

  <script src="/js/particles.js"></script>
</body>
</html>
