<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pillar — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" integrity="sha512-X7rrn44l1+AUO65h1LGALBbOc5C5iv5VZG4NG3WEOv5YLfTyMh2X1G+U1s7vPJnR3U/Gc5qZyl6h6G6JTRpR9rA==" crossorigin="anonymous" />
</head>
<body class="dashboard-page">

  <!-- SIDEBAR NAV -->
  <aside class="sidebar">
    <div class="logo">Pillar<span class="dot">.</span></div>
    <nav class="side-nav">
      <a href="#" class="side-link active" data-section="home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </a>
      <a href="#" class="side-link" data-section="cards">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
        Cards
      </a>
      <a href="#" class="side-link" data-section="analytics">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        Analytics
      </a>
      <a href="#" class="side-link" data-section="profile">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        Profile
      </a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="dash-main" id="dashMain">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="avatar">AT</div>
        <div>
          <p class="greeting" id="greeting">Good morning!</p>
          <p class="username">Alex T.</p>
        </div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="notifBtn" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-dot"></span>
        </button>
      </div>
    </header>

    <!-- BALANCE CARD -->
    <section class="balance-section animate__animated animate__fadeInUp">
      <div class="balance-card">
        <div class="balance-label">Balance</div>
        <div class="balance-row">
          <span class="balance-amount" id="balanceDisplay">$10 524.15</span>
          <button class="eye-btn" id="toggleBalance" aria-label="Toggle balance visibility">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="action-grid">
          <button class="action-btn" onclick="openModal('send')">
            <div class="action-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </div>
            <span>Send</span>
          </button>
          <button class="action-btn" onclick="openModal('receive')">
            <div class="action-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </div>
            <span>Receive</span>
          </button>
          <button class="action-btn" onclick="openModal('topup')">
            <div class="action-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="12" y1="9" x2="12" y2="15"/><line x1="9" y1="12" x2="15" y2="12"/></svg>
            </div>
            <span>Top Up</span>
          </button>
          <button class="action-btn" onclick="openModal('freeze')">
            <div class="action-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <span>Freeze</span>
          </button>
        </div>
      </div>
    </section>

    <!-- CARDS SECTION -->
    <section class="cards-section animate__animated animate__fadeInUp animate__delay-1s">
      <div class="section-header">
        <h2>Cards</h2>
        <button class="text-btn">+ New card</button>
      </div>
      <div class="cards-scroll" id="cardsScroll">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- SPENDING DONUT -->
    <section class="spending-section animate__animated animate__fadeInUp animate__delay-1s">
      <div class="section-header">
        <h2>Spending <span class="muted-text">— April 2025</span></h2>
        <button class="icon-btn" aria-label="More options">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </button>
      </div>
      <div class="spending-inner">
        <div class="donut-wrap">
          <canvas id="spendChart" width="180" height="180"></canvas>
          <div class="donut-center">
            <span class="donut-label">Total</span>
            <span class="donut-value" id="donutTotal">$7 683.21</span>
          </div>
        </div>
        <div class="spend-legend" id="spendLegend"></div>
      </div>
    </section>

    <!-- INVESTMENTS -->
    <section class="invest-section animate__animated animate__fadeInUp animate__delay-2s">
      <div class="section-header">
        <h2>Investments portfolio</h2>
        <button class="text-btn">View all</button>
      </div>
      <div id="investList"></div>
    </section>

    <!-- RECENT TRANSACTIONS -->
    <section class="txn-section animate__animated animate__fadeInUp animate__delay-2s">
      <div class="section-header">
        <h2>Recent</h2>
        <button class="text-btn">View all</button>
      </div>
      <div id="txnList"></div>
    </section>

  </main>

  <!-- BOTTOM NAV (mobile) -->
  <nav class="bottom-nav">
    <a href="#" class="active" aria-label="Home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </a>
    <a href="#" aria-label="Cards">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
    </a>
    <a href="#" aria-label="Analytics">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
    </a>
    <a href="#" aria-label="Profile">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </a>
  </nav>

  <!-- ===== MODALS ===== -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal" id="modalBox" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modalTitle">Action</h3>
        <button class="close-btn" onclick="closeModal()" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" integrity="sha384-DxhYObIMImxe+0p9hHoIGG0ULYcTgPZOe1NkjUZd9FNjO3iqU5tT3l4dV4JRI3T8b" crossorigin="anonymous"></script>
  <script src="/js/app.js"></script>
</body>
</html>
